<!DOCTYPE html>
<html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Админ · politiq.mn</title>
<style>
:root{--bg:#fbfaf8;--text:#141414;--muted:#6e6a64;--line:#e6e2dc;--accent:#b42318;--ok:#1a7f37;--serif:Georgia,"Times New Roman",serif;--sans:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 var(--sans)}
header{background:#fff;border-bottom:1px solid var(--line)}
.wrap{max-width:820px;margin:0 auto;padding:0 20px}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 0}
.logo{font:700 26px var(--serif);color:inherit;text-decoration:none}.logo span{color:var(--accent)}
h1{font:700 28px var(--serif);margin:28px 0 8px}h2{font:700 20px var(--serif);margin:36px 0 10px}
label{display:block;font-size:14px;font-weight:600;margin:16px 0 6px}
input,select,textarea{width:100%;padding:11px 12px;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:5px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
textarea{min-height:260px;resize:vertical}
.hint{color:var(--muted);font-size:13px;margin-top:4px}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.chk{display:flex;gap:10px;align-items:center;margin-top:16px;font-weight:600}.chk input{width:20px;height:20px}
.btn{min-height:44px;padding:11px 22px;font:600 16px var(--sans);border:0;border-radius:5px;background:var(--accent);color:#fff;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}.ghost{background:#fff;color:var(--text);border:1px solid var(--line)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.msg{margin-top:14px;padding:10px 14px;border-radius:5px;font-size:15px;display:none}
.msg.ok{display:block;background:#e9f6ec;color:var(--ok)}.msg.err{display:block;background:#fdf1ef;color:var(--accent)}
#preview{display:none;margin-top:10px;max-width:320px;border-radius:5px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:24px;margin-top:20px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
li img{width:84px;height:56px;object-fit:cover;border-radius:4px;background:#eee;flex:none}
li .t{flex:1}li .t b{display:block;font-family:var(--serif);font-size:16px}
li .m{color:var(--muted);font-size:13px}
.pin{color:#fff;background:var(--accent);font-size:11px;font-weight:700;padding:2px 7px;border-radius:3px;margin-left:6px}
.sm{min-height:36px;padding:6px 12px;font-size:14px}
.hide{display:none}
@media(max-width:600px){.row{grid-template-columns:1fr}li{flex-wrap:wrap}}
</style></head><body>
<header><div class="wrap top"><a class="logo" href="/">politiq<span>.mn</span></a><button id="logout" class="btn ghost sm hide">Гарах</button></div></header>
<main class="wrap">

<section id="login" class="card">
  <h1>Админ нэвтрэх</h1>
  <form id="loginForm">
    <label for="pass">Нууц үг</label>
    <input id="pass" type="password" autocomplete="current-password" required>
    <div class="actions"><button class="btn">Нэвтрэх</button></div>
    <div id="loginMsg" class="msg"></div>
  </form>
</section>

<section id="panel" class="hide">
  <div class="card">
    <h1 id="formTitle">Шинэ мэдээ нийтлэх</h1>
    <form id="postForm">
      <input type="hidden" id="pid">
      <label for="t">Гарчиг *</label>
      <input id="t" required maxlength="200">
      <div class="row">
        <div><label for="c">Ангилал</label>
          <select id="c"><option>Улс төр</option><option>Эдийн засаг</option><option>Нийгэм</option><option>Спорт</option><option>Технологи</option><option>Эрүүл мэнд</option><option>Байгаль орчин</option></select></div>
        <div><label for="img">Зураг</label><input id="img" type="file" accept="image/*">
          <div class="hint">Компьютер эсвэл утаснаасаа сонгоно. Сонгоогүй бол ангиллын зураг гарна.</div></div>
      </div>
      <img id="preview" alt="">
      <label for="body">Мэдээний текст *</label>
      <textarea id="body" required></textarea>
      <div class="hint">Догол мөр бүрийн хооронд нэг хоосон мөр үлдээнэ.</div>
      <label class="chk"><input id="pin" type="checkbox"> Нүүр хуудасны том хэсэгт онцлох</label>
      <div class="actions">
        <button id="save" class="btn">Нийтлэх</button>
        <button id="cancel" type="button" class="btn ghost hide">Засварыг цуцлах</button>
      </div>
      <div id="msg" class="msg"></div>
    </form>
  </div>

  <h2>Миний нийтэлсэн мэдээ</h2>
  <ul id="list"></ul>
  <p id="empty" class="hint">Одоогоор нийтэлсэн мэдээ алга.</p>
</section>
</main>

<script>
{
const $=id=>document.getElementById(id);
let pass="";try{pass=sessionStorage.getItem("ap")||""}catch(e){}
let posts=[],image="";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const show=(el,text,ok)=>{el.textContent=text;el.className="msg "+(ok?"ok":"err")};

async function api(method,body,q=""){
  const r=await fetch("/api/admin"+q,{method,headers:{"Content-Type":"application/json","x-admin-password":pass},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({error:"Серверээс хариу ирсэнгүй"}));
  if(!r.ok)throw Object.assign(new Error(j.error||"Алдаа"),{status:r.status});
  return j;
}

async function load(){
  posts=await api("GET");
  $("empty").style.display=posts.length?"none":"block";
  $("list").innerHTML=posts.map(p=>`<li><img src="${esc(p.img||"")}" alt="" onerror="this.style.visibility='hidden'">
    <div class="t"><b>${esc(p.t)}${p.pin?'<span class="pin">ОНЦЛОХ</span>':""}</b><span class="m">${esc(p.c)} · ${new Date(p.at).toLocaleString("mn-MN")}</span></div>
    <button class="btn ghost sm" data-edit="${esc(p.id)}">Засах</button><button class="btn ghost sm" data-del="${esc(p.id)}">Устгах</button></li>`).join("");
}

async function enter(){
  try{await load();$("login").classList.add("hide");$("panel").classList.remove("hide");$("logout").classList.remove("hide");try{sessionStorage.setItem("ap",pass)}catch(e){}}
  catch(e){pass="";try{sessionStorage.removeItem("ap")}catch(x){}show($("loginMsg"),e.message,false)}
}

$("loginForm").addEventListener("submit",e=>{e.preventDefault();pass=$("pass").value;enter()});
$("logout").addEventListener("click",()=>{try{sessionStorage.removeItem("ap")}catch(e){}location.reload()});

// Зургийг хөтөч дээр 1200px болгож шахна (сервер рүү хөнгөн очно)
$("img").addEventListener("change",async()=>{
  const f=$("img").files[0];if(!f)return;
  const url=URL.createObjectURL(f);const im=new Image();
  im.onload=()=>{const W=Math.min(1200,im.width),H=Math.round(im.height*W/im.width);
    const cv=document.createElement("canvas");cv.width=W;cv.height=H;cv.getContext("2d").drawImage(im,0,0,W,H);
    let q=.82;image=cv.toDataURL("image/jpeg",q);while(image.length>900000&&q>.4){q-=.1;image=cv.toDataURL("image/jpeg",q)}
    $("preview").src=image;$("preview").style.display="block";URL.revokeObjectURL(url)};
  im.onerror=()=>show($("msg"),"Энэ зургийг уншиж чадсангүй. JPG эсвэл PNG сонгоно уу.",false);
  im.src=url;
});

function reset(){$("postForm").reset();$("pid").value="";image="";$("preview").style.display="none";
  $("formTitle").textContent="Шинэ мэдээ нийтлэх";$("save").textContent="Нийтлэх";$("cancel").classList.add("hide")}
$("cancel").addEventListener("click",reset);

$("postForm").addEventListener("submit",async e=>{
  e.preventDefault();const id=$("pid").value;$("save").disabled=true;
  try{
    await api(id?"PUT":"POST",{id,t:$("t").value,c:$("c").value,body:$("body").value,pin:$("pin").checked,image});
    show($("msg"),id?"Засвар хадгалагдлаа.":"Нийтлэгдлээ! 1 минутын дотор нүүр хуудсанд гарна.",true);reset();await load();
  }catch(err){show($("msg"),err.message,false);if(err.status===401)setTimeout(()=>location.reload(),1500)}
  $("save").disabled=false;
});

$("list").addEventListener("click",async e=>{
  const ed=e.target.dataset.edit,del=e.target.dataset.del;
  if(ed){const p=posts.find(x=>x.id===ed);if(!p)return;
    $("pid").value=p.id;$("t").value=p.t;$("c").value=p.c;$("body").value=p.b.join("\n\n");$("pin").checked=!!p.pin;image="";
    if(p.img){$("preview").src=p.img;$("preview").style.display="block"}
    $("formTitle").textContent="Мэдээ засах";$("save").textContent="Хадгалах";$("cancel").classList.remove("hide");scrollTo(0,0)}
  if(del){
    if(e.target.dataset.sure!=="1"){e.target.dataset.sure="1";e.target.textContent="Итгэлтэй юу?";setTimeout(()=>{e.target.dataset.sure="";e.target.textContent="Устгах"},3000);return}
    try{await api("DELETE",null,"?id="+encodeURIComponent(del));await load()}catch(err){show($("msg"),err.message,false)}}
});

if(pass)enter();
}
</script>
</body></html>
